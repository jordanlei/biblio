<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bibliograph</title>
    <style>
      :root {
        --bg: #fbf8f1;
        --text: #1f1c17;
        --text-2: #5a554b;
        --text-3: #8b8475;
        --border: #e2dac8;
        --accent: #7b2a20;
        --accent-soft: #f1e2d7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1a16;
          --text: #ece5d6;
          --text-2: #b4ab99;
          --text-3: #857c6d;
          --border: #312c25;
          --accent: #df947b;
          --accent-soft: #3a251e;
          color-scheme: dark;
        }
      }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .brand {
        margin: 0 0 12px;
        font: 600 15px Georgia, "Times New Roman", serif;
      }
      .eyebrow {
        margin: 0 0 4px;
        font: 600 11px system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      h1 {
        margin: 0 0 6px;
        font: 600 16px/1.3 Georgia, "Times New Roman", serif;
      }
      .meta {
        margin: 0 0 10px;
        color: var(--text-2);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 0 0 14px;
      }
      .chip {
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11.5px;
        font-weight: 600;
      }
      button {
        width: 100%;
        height: 36px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        margin-top: 8px;
        border-color: var(--border);
        background: transparent;
        color: var(--text);
        font-weight: 500;
      }
      .settings {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: var(--text-3);
        font-size: 12px;
      }
      .settings select {
        width: 100%;
        margin-top: 4px;
        font: inherit;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <p class="brand">Bibliograph</p>
    <section id="found" hidden>
      <p class="eyebrow">Paper detected</p>
      <h1 id="title"></h1>
      <p id="meta" class="meta"></p>
      <div id="chips" class="chips"></div>
      <button id="save" type="button">Save to Bibliograph</button>
    </section>
    <section id="none" hidden>
      <h1>No paper detected on this page.</h1>
      <p class="meta">Open an article page (arXiv, a journal, PubMed…) or a PDF and try again.</p>
      <button id="open" type="button">Open my library</button>
      <button id="add" class="secondary" type="button">Search for a paper</button>
    </section>
    <p id="loading" class="meta">Reading this page…</p>
    <label class="settings">
      Save to
      <select id="app">
        <option id="hosted-app"></option>
        <option value="http://localhost:5173">localhost:5173 (local test mode)</option>
      </select>
    </label>
    <script src="app-url.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
