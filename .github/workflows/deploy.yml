# Deploy this copy to its own Firebase project on every push to main.
# Turned on by `npm run setup -- --github`, which stores two things in the repository settings:
#   variable BIBLIOGRAPH_CONFIG     this copy's bibliograph.config.json
#   secret   FIREBASE_SERVICE_ACCOUNT  a deploy-only service account key
# Without them (e.g. a fresh fork) the job is skipped. See docs/SELF_HOSTING.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.BIBLIOGRAPH_CONFIG != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        env:
          BIBLIOGRAPH_CONFIG: ${{ vars.BIBLIOGRAPH_CONFIG }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/deployer.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/deployer.json"
          npm run deploy
